<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<style>
body{font-family:Arial;max-width:420px;margin:40px auto;padding:0 16px}
input{width:100%;padding:10px;font-size:16px;box-sizing:border-box}
#bar{height:10px;border-radius:5px;margin-top:10px;background:#ddd}
#fill{height:100%;width:0;border-radius:5px;transition:.3s}
li{margin:4px 0}
</style>
</head>
<body>
<h2>Password Strength Checker</h2>
<input id="pw" type="password" placeholder="Enter password">
<label><input type="checkbox" onclick="pw.type=this.checked?'text':'password'"> Show</label>
<div id="bar"><div id="fill"></div></div>
<h3 id="label"></h3>
<ul id="tips"></ul>
<script>
pw.addEventListener("input", () => {
  const p = pw.value;
  const checks = [
    [p.length >= 8, "At least 8 characters"],
    [/[a-z]/.test(p), "A lowercase letter"],
    [/[A-Z]/.test(p), "An uppercase letter"],
    [/[0-9]/.test(p), "A number"],
    [/[^A-Za-z0-9]/.test(p), "A special character"]
  ];
  let score = checks.filter(c => c[0]).length;
  if (p.length >= 12) score++;
  const levels = ["Very Weak","Weak","Fair","Good","Strong","Very Strong"];
  const colors = ["#e74c3c","#e67e22","#f1c40f","#9acd32","#2ecc71","#27ae60"];
  fill.style.width = (score/6*100) + "%";
  fill.style.background = colors[score-1] || "#ddd";
  label.textContent = p ? levels[Math.max(score-1,0)] : "";
  tips.innerHTML = p ? checks.filter(c=>!c[0]).map(c=>"<li>Add: "+c[1]+"</li>").join("") : "";
});
</script>
</body>
</html>
